<!-- Copier ce gabarit dans .application-projects. Remplacer tous les {{champs}}, les trois captures et leurs libellés. -->
<article class="project project-{{slug}}" id="{{anchor}}" aria-labelledby="{{slug}}-title" data-availability="{{availability}}" data-priority="{{priority}}" data-reveal>
        <div class="project-intro"><div class="project-identity"><img class="app-logo" src="img/{{slug}}-transparent-192.webp" width="56" height="56" alt="" loading="lazy"><div><p class="eyebrow">{{category_platforms}}</p><h3 id="{{slug}}-title">{{name}}</h3></div></div><span class="project-status {{status_class}}">{{status_label}}</span></div>
        <p class="project-statement">{{headline}}<br><em>{{headline_accent}}</em></p><p>{{description}}</p>
        <div class="phone-demo" data-screen-gallery><div class="phone-halo" aria-hidden="true"></div><a class="phone-frame gallery-image" aria-label="Agrandir la capture de {{name}} : {{screen_1_label}}" data-zoom href="{{screen_1_path}}"><img src="{{screen_1_path}}" width="360" height="800" alt="{{screen_1_alt}}" loading="lazy" data-gallery-image></a><div class="phone-selector" role="group" hidden aria-label="Choisir un écran de {{name}}"><button type="button" aria-pressed="true" data-screen="{{screen_1_path}}" data-alt="{{screen_1_alt}}">{{screen_1_label}}</button><button type="button" aria-pressed="false" data-screen="{{screen_2_path}}" data-alt="{{screen_2_alt}}">{{screen_2_label}}</button><button type="button" aria-pressed="false" data-screen="{{screen_3_path}}" data-alt="{{screen_3_alt}}">{{screen_3_label}}</button></div><p class="demo-caption" aria-live="polite">{{screen_1_label}} · Capture réelle de {{name}}.</p></div>
        <a class="text-link" href="{{slug}}/">Découvrir {{name}}</a>
      </article>
