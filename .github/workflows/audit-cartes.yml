name: Cartes des applications
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier le gabarit et l’ordre des cartes
        run: python .github/scripts/audit_application_cards.py
      - name: Vérifier les garde-fous pour les futures applications
        run: python .github/scripts/test_application_cards.py
      - name: Vérifier les interactions et le retour du cache de navigation
        run: node .github/scripts/test_site_interactions.cjs
